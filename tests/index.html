<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GharKa — planner checks</title><style>body{font:16px system-ui;max-width:800px;margin:40px auto;padding:20px;color:#284d3e}li{padding:9px}a{color:inherit}</style><h1>Planner checks</h1><p id="summary">Running…</p><ol id="results"></ol><a href="/">Back to GharKa</a><script type="module">import {runSuite} from './suite.js';const results=runSuite();document.querySelector('#summary').textContent=`${results.filter(r=>r.passed).length} / ${results.length} checks passed`;for(const r of results){const li=document.createElement('li');li.textContent=`${r.passed?'PASS':'FAIL'} — ${r.name}${r.error?': '+r.error:''}`;document.querySelector('#results').append(li);}</script></html>
